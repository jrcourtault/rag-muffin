<app-page-content title="nav.chat">

  <div class="flex mb-4">
    <input
      pInputText
      class="flex-1"
      [placeholder]="'chat.placeholder' | transloco"
      [ngModel]="question()"
      (ngModelChange)="question.set($event)"
      (keydown)="onKeydown($event)"
      [disabled]="loading()"/>
  </div>

  <div class="flex items-center gap-2">
    <p-toggleSwitch
      inputId="chat-query-rewriting"
      [ngModel]="queryRewriting()"
      (ngModelChange)="queryRewriting.set($event)"
      [disabled]="loading()"/>
    <label for="chat-query-rewriting" class="text-sm text-surface-600 cursor-pointer">
      {{ 'rag.queryRewriting' | transloco }}
    </label>
  </div>

  @if (loading()) {
    <app-spinner/>
  }

  @if (response(); as res) {
    @if (res.rewrittenQuestion) {
      <p class="text-sm text-surface-500 italic mb-4">
        {{ 'rag.rewrittenQuestion' | transloco }} : {{ res.rewrittenQuestion }}
      </p>
    }
    <app-subtitle title="chat.answer" class="mt-7 block"/>
    <p-card>
      <p class="whitespace-pre-line leading-relaxed">{{ res.answer }}</p>
    </p-card>

    @if (res.chunks && res.chunks.length > 0) {
      <app-subtitle title="chat.sources" class="mt-7 block"/>
      <div class="flex flex-col gap-3">
        @for (chunk of res.chunks; track $index) {
          <app-chunk-card [chunk]="chunk" [index]="$index"/>
        }
      </div>
    }
  }

</app-page-content>
